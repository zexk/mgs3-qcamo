name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31

      - name: Build
        run: nix build -L

      - name: Package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir dist
          cp result/qcamo.asi dist/
          cd dist
          python3 -m zipfile -c "qcamo-${VERSION}.zip" qcamo.asi

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*.zip
